# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Proof of Concept Demo

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --ignore=C901 --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    # - name: Test with pytest
    #   run: |
    #     pytest
    # Basic Smoke Test
    - name: Smoke Test
      run: |
        python3 helix_lm/smoke_test.py
    - name: Test safe Iteration on Unknown Len Streaming
      timeout-minutes: 15
      run: |
        python3 text_iter_unknown_len_pretrain.py
    # Test PretrainTrainer and pretrain Dataset tooling
    - name: Pretrain streaming equivalence test
      timeout-minutes: 120
      run: |
        python3 test_pretrain_streaming_equivalence.py
    - name: Pretraining data and launcher courts
      timeout-minutes: 30
      run: |
        python -m unittest \
          test_pretrain_data.py \
          test_pretrain_data_court.py \
          test_experiment_tracking.py \
          test_113m_param_train.py
        python pretrain_data_court.py
    # Train a minimal model with PretrainTrainer
    - name: Demo run 
      timeout-minutes: 90
      run: |
        python3 quick_demo_cpu_multiscale.py
    # Test SFTTrainer and its Dataset Tooling
    - name: Smoke Test Training with Datasets
      timeout-minutes: 120
      run: |
        python3 test_streaming_equivalence.py
    # Train with SFT trainer and Titans Enabled
    - name: Demo run - Titans Memory
      timeout-minutes: 90
      run: |
        python3 quick_demo_cpu_titans_mem.py
